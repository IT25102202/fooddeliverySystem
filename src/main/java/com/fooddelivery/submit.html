<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Submit Review - FoodHub</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        .star-rating { display:flex; gap:.5rem; flex-direction:row-reverse; justify-content:flex-end; }
        .star-rating input { display:none; }
        .star-rating label { font-size:2.5rem; color:#d1d5db; cursor:pointer; transition:.15s; }
        .star-rating label:hover, .star-rating label:hover ~ label,
        .star-rating input:checked ~ label { color:#f59e0b; }
    </style>
</head>
<body>
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/}"><div class="logo-icon">🍔</div>Food<span>Hub</span></a>
    <ul class="nav-links">
        <li><a th:href="@{/order/history}">My Orders</a></li>
        <li><a th:href="@{/profile}"><i class="fa fa-user"></i> [[${user.username}]]</a></li>
        <li><a th:href="@{/logout}">Logout</a></li>
    </ul>
</nav>
<div class="page-header">
    <h1><i class="fa fa-star"></i> Write a Review</h1>
    <p>Share your experience with others</p>
</div>

<div class="section" style="max-width:600px;">
    <!-- RESTAURANT CARD -->
    <div class="card fade-in" style="border-radius:var(--radius-lg); margin-bottom:2rem; display:flex; overflow:hidden;" th:if="${restaurant != null}">
        <img th:src="${restaurant.imageUrl}" th:alt="${restaurant.name}"
             style="width:120px; height:120px; object-fit:cover; flex-shrink:0;"
             onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600'"/>
        <div class="card-body">
            <h3 style="font-family:'Playfair Display',serif;" th:text="${restaurant.name}">Restaurant</h3>
            <p style="color:var(--text-muted); font-size:.85rem;" th:text="${restaurant.cuisine + ' · ' + restaurant.city}">Cuisine</p>
            <span class="badge badge-success">Your Order: [[${order.id}]]</span>
        </div>
    </div>

    <!-- REVIEW FORM -->
    <div class="card fade-in" style="border-radius:var(--radius-lg);">
        <div class="card-body" style="padding:2rem;">
            <form method="post" th:action="@{/review/submit}">
                <input type="hidden" name="restaurantId"   th:value="${order.restaurantId}"/>
                <input type="hidden" name="restaurantName" th:value="${order.restaurantName}"/>
                <input type="hidden" name="orderId"        th:value="${order.id}"/>

                <div class="form-group">
                    <label class="form-label" style="font-size:1rem;">Your Rating</label>
                    <div class="star-rating">
                        <input type="radio" id="star5" name="rating" value="5" required/><label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4"/><label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3"/><label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2"/><label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1"/><label for="star1">★</label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Your Review</label>
                    <textarea name="comment" class="form-control" rows="5" placeholder="Tell others about your experience - the food quality, delivery speed, packaging..." required minlength="10"></textarea>
                </div>
                <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                    <button type="submit" class="btn btn-primary btn-lg"><i class="fa fa-paper-plane"></i> Submit Review</button>
                    <a th:href="@{/order/history}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
<footer class="footer"><div class="footer-bottom">&copy; 2025 FoodHub</div></footer>
</body>
</html>
