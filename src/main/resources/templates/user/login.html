<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login - FoodHub</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
.auth-wrap {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: #f9f9fb;
}
.auth-image {
  background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1000') center/cover;
  position: relative;
  display: flex;
  align-items: flex-end;
  padding: 2.5rem;
}
.auth-image::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.2) 60%);
}
.auth-image-text { position: relative; z-index: 1; color: white; }
.auth-image-text h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: .5rem; }
.auth-image-text p  { opacity: .75; font-size: .95rem; }
.auth-form-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 2rem;
}
.auth-form {
  width: 100%;
  max-width: 420px;
}
.auth-logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 900;
  color: var(--dark);
  margin-bottom: 2rem;
  display: block;
  text-decoration: none;
}
.auth-logo span { color: var(--primary); }
@media(max-width:768px) {
  .auth-wrap { grid-template-columns: 1fr; }
  .auth-image { display: none; }
}
</style>
</head>
<body>

<div class="auth-wrap">
  <!-- LEFT IMAGE -->
  <div class="auth-image">
    <div class="auth-image-text">
      <h2>Welcome Back!</h2>
      <p>Sign in to order your favourite food and track your deliveries.</p>
      <div style="margin-top:1.2rem; display:flex; gap:1.5rem; font-size:.88rem; opacity:.8;">
        <span>🍕 Italian</span>
        <span>🍔 Burgers</span>
        <span>🍣 Sushi</span>
        <span>🍛 Curry</span>
      </div>
    </div>
  </div>

  <!-- RIGHT FORM -->
  <div class="auth-form-wrap">
    <div class="auth-form fade-in">
      <a th:href="@{/}" class="auth-logo">Food<span>Hub</span></a>
      <h1 style="font-size:1.7rem; font-weight:700; margin-bottom:.3rem;">Sign In</h1>
      <p style="color:var(--text-muted); margin-bottom:2rem; font-size:.9rem;">Don't have an account? <a th:href="@{/register}" style="color:var(--primary); font-weight:600;">Sign up free</a></p>

      <!-- Flash messages -->
      <div th:if="${error}" class="alert alert-error">
        <i class="fa fa-circle-exclamation"></i> <span th:text="${error}"></span>
      </div>
      <div th:if="${success}" class="alert alert-success">
        <i class="fa fa-circle-check"></i> <span th:text="${success}"></span>
      </div>

      <form method="post" th:action="@{/login}">
        <div class="form-group">
          <label class="form-label"><i class="fa fa-envelope" style="color:var(--primary)"></i> Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label class="form-label"><i class="fa fa-lock" style="color:var(--primary)"></i> Password</label>
          <input type="password" name="password" class="form-control" placeholder="Your password" required/>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem;">
          <i class="fa fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div style="margin-top:2rem; padding:1rem; background:#f9f9fb; border-radius:10px; font-size:.82rem; color:var(--text-muted);">
        <strong>Demo Accounts:</strong><br/>
        Admin: admin@foodhub.lk / admin123<br/>
        Customer: kasun@gmail.com / password123
      </div>

      <div style="text-align:center; margin-top:1.5rem;">
        <a th:href="@{/}" style="color:var(--text-muted); font-size:.85rem;"><i class="fa fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
