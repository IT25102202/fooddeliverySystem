<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Register - FoodHub</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
.auth-wrap { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; background:#f9f9fb; }
.auth-image { background:url('https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=1000') center/cover; position:relative; display:flex; align-items:flex-end; padding:2.5rem; }
.auth-image::before { content:''; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.8) 0%,rgba(0,0,0,.2) 60%); }
.auth-image-text { position:relative; z-index:1; color:white; }
.auth-image-text h2 { font-family:'Playfair Display',serif; font-size:2rem; margin-bottom:.5rem; }
.auth-form-wrap { display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
.auth-form { width:100%; max-width:480px; }
.auth-logo { font-family:'Playfair Display',serif; font-size:1.8rem; font-weight:900; color:var(--dark); margin-bottom:2rem; display:block; text-decoration:none; }
.auth-logo span { color:var(--primary); }
@media(max-width:768px) { .auth-wrap { grid-template-columns:1fr; } .auth-image { display:none; } }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-image">
    <div class="auth-image-text">
      <h2>Join FoodHub Today!</h2>
      <p>Create your account and start ordering from the best restaurants in your city.</p>
      <div style="margin-top:1.2rem; display:flex; gap:1.5rem; font-size:.88rem; opacity:.8;">
        <span>✅ Free Signup</span>
        <span>🚀 Fast Delivery</span>
        <span>💳 Easy Payment</span>
      </div>
    </div>
  </div>

  <div class="auth-form-wrap">
    <div class="auth-form fade-in">
      <a th:href="@{/}" class="auth-logo">Food<span>Hub</span></a>
      <h1 style="font-size:1.7rem; font-weight:700; margin-bottom:.3rem;">Create Account</h1>
      <p style="color:var(--text-muted); margin-bottom:2rem; font-size:.9rem;">Already have an account? <a th:href="@{/login}" style="color:var(--primary); font-weight:600;">Sign in</a></p>

      <div th:if="${error}" class="alert alert-error"><i class="fa fa-circle-exclamation"></i> <span th:text="${error}"></span></div>

      <form method="post" th:action="@{/register}">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label"><i class="fa fa-user" style="color:var(--primary)"></i> Full Name</label>
            <input type="text" name="username" class="form-control" placeholder="Kasun Perera" required/>
          </div>
          <div class="form-group">
            <label class="form-label"><i class="fa fa-phone" style="color:var(--primary)"></i> Phone</label>
            <input type="tel" name="phone" class="form-control" placeholder="077XXXXXXX" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label"><i class="fa fa-envelope" style="color:var(--primary)"></i> Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label class="form-label"><i class="fa fa-lock" style="color:var(--primary)"></i> Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" minlength="6" required/>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label"><i class="fa fa-map-marker" style="color:var(--primary)"></i> Address</label>
            <input type="text" name="address" class="form-control" placeholder="45 Galle Road"/>
          </div>
          <div class="form-group">
            <label class="form-label"><i class="fa fa-city" style="color:var(--primary)"></i> City</label>
            <input type="text" name="city" class="form-control" placeholder="Colombo"/>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:.5rem;">
          <i class="fa fa-user-plus"></i> Create My Account
        </button>
      </form>

      <div style="text-align:center; margin-top:1.5rem;">
        <a th:href="@{/}" style="color:var(--text-muted); font-size:.85rem;"><i class="fa fa-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
