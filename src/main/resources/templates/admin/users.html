<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Users - Admin - FoodHub</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" th:href="@{/}"><div class="logo-icon">🍔</div>Food<span>Hub</span> <span style="font-size:.7rem; background:var(--accent); color:#1a1a1a; padding:.1rem .5rem; border-radius:6px; margin-left:.4rem;">ADMIN</span></a>
  <ul class="nav-links">
    <li><a th:href="@{/}">View Site</a></li>
    <li><a th:href="@{/logout}">Logout</a></li>
  </ul>
</nav>
<div class="layout-admin">
  <aside class="admin-sidebar">
    <div class="sidebar-section">Dashboard</div>
    <a th:href="@{/admin/dashboard}"><i class="fa fa-gauge-high"></i> Overview</a>
    <div class="sidebar-section">Management</div>
    <a th:href="@{/admin/users}" class="active"><i class="fa fa-users"></i> Users</a>
    <a th:href="@{/admin/restaurants}"><i class="fa fa-store"></i> Restaurants</a>
    <a th:href="@{/admin/food}"><i class="fa fa-utensils"></i> Food Items</a>
    <a th:href="@{/admin/orders}"><i class="fa fa-list-alt"></i> Orders</a>
    <a th:href="@{/admin/payments}"><i class="fa fa-credit-card"></i> Payments</a>
    <a th:href="@{/admin/reviews}"><i class="fa fa-star"></i> Reviews</a>
    <div class="sidebar-section">Site</div>
    <a th:href="@{/}"><i class="fa fa-globe"></i> View Site</a>
    <a th:href="@{/logout}"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </aside>
  <main class="admin-main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; flex-wrap:wrap; gap:1rem;">
      <h1 style="font-family:'Playfair Display',serif; font-size:1.6rem;"><i class="fa fa-users" style="color:var(--primary)"></i> User Management</h1>
    </div>
    <div th:if="${success}" class="alert alert-success"><i class="fa fa-circle-check"></i> <span th:text="${success}"></span></div>
    <div th:if="${error}"   class="alert alert-error"><i class="fa fa-circle-exclamation"></i> <span th:text="${error}"></span></div>
    <!-- SEARCH -->
    <form th:action="@{/admin/users}" method="get" style="display:flex; gap:1rem; margin-bottom:1.5rem;">
      <input type="text" name="search" class="form-control" style="max-width:360px;" placeholder="Search by name, email..." th:value="${search}"/>
      <button class="btn btn-primary"><i class="fa fa-search"></i> Search</button>
      <a th:href="@{/admin/users}" class="btn btn-outline">Clear</a>
    </form>
    <div class="card" style="border-radius:var(--radius-lg);">
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Actions</th></tr></thead>
          <tbody>
            <tr th:each="u : ${users}">
              <td style="font-family:monospace; font-size:.78rem;" th:text="${u.id}">ID</td>
              <td><strong th:text="${u.username}">Name</strong></td>
              <td th:text="${u.email}">Email</td>
              <td th:text="${u.phone}">Phone</td>
              <td>
                <span th:class="${u.role == 'ADMIN'} ? 'badge badge-warning' : 'badge badge-info'" th:text="${u.role}">CUSTOMER</span>
              </td>
              <td>
                <form th:action="@{'/admin/users/delete/' + ${u.id}}" method="post"
                      onsubmit="return confirm('Delete this user?')" style="display:inline;">
                  <button class="btn btn-sm btn-danger" th:if="${u.id != 'ADM001'}"><i class="fa fa-trash"></i> Delete</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p style="color:var(--text-muted); font-size:.85rem; margin-top:1rem;">Total: <strong th:text="${#lists.size(users)}">0</strong> users</p>
  </main>
</div>
</body>
</html>
