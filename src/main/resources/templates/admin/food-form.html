<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Food Item Form - Admin - FoodHub</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" th:href="@{/}"><div class="logo-icon">🍔</div>Food<span>Hub</span>
    <span style="font-size:.7rem;background:var(--accent);color:#1a1a1a;padding:.1rem .5rem;border-radius:6px;margin-left:.4rem;">ADMIN</span></a>
  <ul class="nav-links">
    <li><a th:href="@{/admin/food}">← Back to Food Items</a></li>
    <li><a th:href="@{/logout}">Logout</a></li>
  </ul>
</nav>
<div class="layout-admin">
  <aside class="admin-sidebar">
    <div class="sidebar-section">Dashboard</div>
    <a th:href="@{/admin/dashboard}"><i class="fa fa-gauge-high"></i> Overview</a>
    <div class="sidebar-section">Management</div>
    <a th:href="@{/admin/users}"><i class="fa fa-users"></i> Users</a>
    <a th:href="@{/admin/restaurants}"><i class="fa fa-store"></i> Restaurants</a>
    <a th:href="@{/admin/food}" class="active"><i class="fa fa-utensils"></i> Food Items</a>
    <a th:href="@{/admin/orders}"><i class="fa fa-list-alt"></i> Orders</a>
    <a th:href="@{/admin/payments}"><i class="fa fa-credit-card"></i> Payments</a>
    <a th:href="@{/admin/reviews}"><i class="fa fa-star"></i> Reviews</a>
    <div class="sidebar-section">Site</div>
    <a th:href="@{/}"><i class="fa fa-globe"></i> View Site</a>
    <a th:href="@{/logout}"><i class="fa fa-sign-out-alt"></i> Logout</a>
  </aside>
  <main class="admin-main">
    <div style="max-width:700px;">
      <h1 style="font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:1.5rem;">
        <i class="fa fa-utensils" style="color:var(--primary)"></i>
        <span th:text="${editMode} ? 'Edit Food Item' : 'Add New Food Item'">Form</span>
      </h1>
      <div class="card fade-in" style="border-radius:var(--radius-lg);">
        <div class="card-body" style="padding:2rem;">

          <!-- ADD FORM -->
          <form th:if="${!editMode}" method="post" th:action="@{/admin/food/add}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label class="form-label">Item Name *</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Margherita Pizza" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Price (LKR) *</label>
                <input type="number" name="price" class="form-control" placeholder="0.00" min="0" step="0.01" required/>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="2" placeholder="Brief description..."></textarea>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label class="form-label">Restaurant *</label>
                <select name="restaurantId" class="form-select" required>
                  <option value="">Select Restaurant</option>
                  <option th:each="r : ${restaurants}" th:value="${r.id}" th:text="${r.name}"
                          th:selected="${r.id == selectedRestaurant}">Restaurant</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Category *</label>
                <select name="category" class="form-select" required>
                  <option value="MAINCOURSE">🍽️ Main Course</option>
                  <option value="DESSERT">🍰 Dessert</option>
                  <option value="BEVERAGE">🥤 Beverage</option>
                </select>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label class="form-label">Is Vegetarian?</label>
                <select name="isVeg" class="form-select">
                  <option value="true">🌱 Yes</option>
                  <option value="false">🍖 No</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Available?</label>
                <select name="isAvailable" class="form-select">
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Prep Time (min)</label>
                <input type="number" name="prepTime" class="form-control" value="15" min="1" max="120"/>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Image URL (Unsplash recommended)</label>
              <input type="text" name="imageUrl" class="form-control" placeholder="https://images.unsplash.com/..."/>
            </div>
            <div style="display:flex;gap:1rem;flex-wrap:wrap;">
              <button type="submit" class="btn btn-primary btn-lg"><i class="fa fa-save"></i> Add Food Item</button>
              <a th:href="@{/admin/food}" class="btn btn-outline">Cancel</a>
            </div>
          </form>

          <!-- EDIT FORM -->
          <form th:if="${editMode}" method="post" th:action="@{'/admin/food/edit/' + ${foodItem.id}}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label class="form-label">Item Name *</label>
                <input type="text" name="name" class="form-control" th:value="${foodItem.name}" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Price (LKR) *</label>
                <input type="number" name="price" class="form-control" th:value="${foodItem.price}" min="0" step="0.01" required/>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Description</label>
              <textarea name="description" class="form-control" rows="2" th:text="${foodItem.description}"></textarea>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label class="form-label">Restaurant *</label>
                <select name="restaurantId" class="form-select" required>
                  <option th:each="r : ${restaurants}" th:value="${r.id}" th:text="${r.name}"
                          th:selected="${r.id == foodItem.restaurantId}">Restaurant</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Category *</label>
                <select name="category" class="form-select" required>
                  <option value="MAINCOURSE" th:selected="${foodItem.category == 'MAINCOURSE'}">🍽️ Main Course</option>
                  <option value="DESSERT"    th:selected="${foodItem.category == 'DESSERT'}">🍰 Dessert</option>
                  <option value="BEVERAGE"   th:selected="${foodItem.category == 'BEVERAGE'}">🥤 Beverage</option>
                </select>
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label class="form-label">Is Vegetarian?</label>
                <select name="isVeg" class="form-select">
                  <option value="true"  th:selected="${foodItem.veg}">🌱 Yes</option>
                  <option value="false" th:selected="${!foodItem.veg}">🍖 No</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Available?</label>
                <select name="isAvailable" class="form-select">
                  <option value="true"  th:selected="${foodItem.available}">Yes</option>
                  <option value="false" th:selected="${!foodItem.available}">No</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Prep Time (min)</label>
                <input type="number" name="prepTime" class="form-control" th:value="${foodItem.prepTime}" min="1"/>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Image URL</label>
              <input type="text" name="imageUrl" class="form-control" th:value="${foodItem.imageUrl}"/>
            </div>
            <!-- Preview -->
            <div th:if="${foodItem.imageUrl != null and !foodItem.imageUrl.isEmpty()}" style="margin-bottom:1rem;">
              <img th:src="${foodItem.imageUrl}" style="height:100px;border-radius:10px;object-fit:cover;"
                   onerror="this.style.display='none'"/>
            </div>
            <div style="display:flex;gap:1rem;flex-wrap:wrap;">
              <button type="submit" class="btn btn-primary btn-lg"><i class="fa fa-save"></i> Update Food Item</button>
              <a th:href="@{/admin/food}" class="btn btn-outline">Cancel</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
